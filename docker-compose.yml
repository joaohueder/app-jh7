# Postgres local para desenvolvimento e para rodar a migração do SQLite.
# Em produção use o Postgres gerenciado e aponte DATABASE_URL para ele.
services:
  postgres:
    image: postgres:16-alpine
    container_name: jh7-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: appjh7
      POSTGRES_USER: appjh7
      POSTGRES_PASSWORD: teste
    ports:
      - "55432:5432"
    volumes:
      - jh7-pg-data:/var/lib/postgresql/data

volumes:
  jh7-pg-data:
